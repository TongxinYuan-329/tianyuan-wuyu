*{box-sizing:border-box;margin:0;padding:0}

label{font-size:13px;color:#5a4028;cursor:pointer}

  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);
  const KEY = 'tianyuan_unlock';
  async function unlock(pw, silent) {
    $('go').disabled = true; $('msg').textContent = silent ? '' : '正在解锁…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.i) }, key, bytes(P.c)));
      if ($('rem').checked) localStorage.setItem(KEY, pw); else localStorage.removeItem(KEY);
      document.open(); document.write(html); document.close();
    } catch (e) {
      localStorage.removeItem(KEY);
      $('go').disabled = false;
      $('msg').textContent = silent ? '' : '密码不对，再试一次';
      if (!silent) { $('pw').select(); }
    }
  }
  $('f').addEventListener('submit', e => { e.preventDefault(); const pw = $('pw').value; if (pw) unlock(pw, false); });
  if (!window.crypto || !crypto.subtle) { $('msg').textContent = '这个浏览器太旧，请换最新版 Chrome、Edge 或 Safari'; $('go').disabled = true; return; }
  const saved = localStorage.getItem(KEY);
  if (saved) unlock(saved, true);
})();
